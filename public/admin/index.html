<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Админ-панель — ВК Реновация</title><style>body{margin:0;background:#0b0b0d;color:#eee;font:16px system-ui}main{max-width:900px;margin:6vh auto;padding:24px}input,textarea{width:100%;box-sizing:border-box;margin:8px 0 16px;padding:12px;background:#17171b;color:#fff;border:1px solid #444;border-radius:8px}textarea{min-height:360px;font:14px monospace}button{padding:11px 18px;border-radius:8px;border:1px solid #bd9850;background:#bd9850;color:#111;cursor:pointer;margin-right:8px}.muted{color:#aaa}#app{display:none}.error{color:#ff8c8c}</style></head><body><main><section id="login"><h1>Админ-панель</h1><p class="muted">Доступ защищён серверной сессией. Пароль не хранится в браузере или коде сайта.</p><input id="password" type="password" autocomplete="current-password" placeholder="Пароль"><button id="loginBtn">Войти</button><p id="loginError" class="error"></p></section><section id="app"><h1>Редактор сайта</h1><p class="muted">Изменения сохраняются в GitHub и после деплоя появляются на основном сайте.</p><label>Контент JSON</label><textarea id="content" spellcheck="false"></textarea><label>Изображение</label><input id="image" type="file" accept="image/jpeg,image/png,image/webp,image/gif,image/svg+xml"><input id="imageName" placeholder="Имя изображения"><button id="uploadBtn">Загрузить изображение</button><button id="loadBtn">Загрузить</button><button id="saveBtn">Сохранить</button><button id="logoutBtn">Выйти</button><p id="status" class="muted"></p></section></main><script>
const $=id=>document.getElementById(id), api=(url,opt={})=>fetch(url,{credentials:'same-origin',...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});
async function load(){const r=await api('/api/content');if(r.status===401){$('login').style.display='block';$('app').style.display='none';return}const x=await r.json();if(!r.ok)throw Error(x.error);$('content').value=JSON.stringify(JSON.parse(x.content),null,2);$('content').dataset.sha=x.sha;$('login').style.display='none';$('app').style.display='block';}
$('loginBtn').onclick=async()=>{const r=await api('/api/login',{method:'POST',body:JSON.stringify({password:$('password').value})});if(r.ok){$('loginError').textContent='';load()}else $('loginError').textContent='Неверный пароль или серверная настройка не завершена.'};
$('loadBtn').onclick=()=>load();
$('saveBtn').onclick=async()=>{try{const content=JSON.stringify(JSON.parse($('content').value),null,2)+'\n';const r=await api('/api/content',{method:'PUT',body:JSON.stringify({content,sha:$('content').dataset.sha})});$('status').textContent=r.ok?'Сохранено. Vercel запустит обновление сайта.':'Ошибка сохранения.';if(r.ok)load()}catch(e){$('status').textContent='JSON содержит ошибку.'}};
$('uploadBtn').onclick=async()=>{const file=$('image').files[0];if(!file){$('status').textContent='Выберите изображение.';return}if(file.size>5*1024*1024){$('status').textContent='Файл больше 5 МБ.';return}const reader=new FileReader();reader.onload=async()=>{const r=await api('/api/upload',{method:'POST',body:JSON.stringify({type:file.type,data:reader.result,name:$('imageName').value||file.name})});const x=await r.json();$('status').textContent=r.ok?'Загружено: '+x.path:(x.error||'Ошибка загрузки')};reader.readAsDataURL(file)};
$('logoutBtn').onclick=async()=>{await api('/api/logout',{method:'POST'});location.reload()};load().catch(()=>{});
</script></body></html>
