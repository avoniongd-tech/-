<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Админ-панель — ВК Реновация</title><style>:root{--bg:#0b0d12;--panel:#151821;--line:#303440;--gold:#e3b85f;--text:#eee}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,Arial}a{color:var(--gold)}button,input,textarea{font:inherit}button{cursor:pointer}.login{max-width:400px;margin:12vh auto;padding:28px;background:var(--panel);border:1px solid var(--line);border-radius:16px}.login h1,.top h1{font-family:Georgia,serif}.login input,.panel input,.panel textarea{width:100%;padding:12px;margin:6px 0 12px;background:#0b0d12;border:1px solid var(--line);border-radius:8px;color:var(--text)}.btn{border:1px solid var(--gold);background:var(--gold);color:#111;border-radius:8px;padding:11px 16px;font-weight:600}.muted{color:#989da8;font-size:12px}.error{color:#ff7777}.ok{color:#67d49a}.hidden{display:none!important}.top{padding:22px max(20px,5vw);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:20px}.top button{background:transparent;color:var(--gold);border:1px solid var(--line);border-radius:8px;padding:9px 13px}.layout{max-width:1200px;margin:24px auto;padding:0 20px;display:grid;grid-template-columns:220px 1fr;gap:20px}.tabs{display:grid;align-content:start;gap:6px}.tabs button{text-align:left;background:transparent;color:#bbb;border:1px solid transparent;border-radius:8px;padding:13px}.tabs button.active,.tabs button:hover{background:#d5aa5d14;border-color:#d5aa5d66;color:var(--gold)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px}.panel h2{font:500 28px Georgia;margin-top:0}.row{display:flex;gap:12px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:14px 0}.row b{display:block}.secret{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center}.secret input{margin:0}.lead{border:1px solid var(--line);border-radius:10px;padding:14px;margin:10px 0}.lead pre{white-space:pre-wrap;color:#bfc3cc;font-size:12px}.toast{position:fixed;right:20px;bottom:20px;background:#202632;border:1px solid var(--gold);padding:14px;border-radius:8px}.wide{min-height:120px}@media(max-width:750px){.layout{grid-template-columns:1fr}.tabs{grid-template-columns:repeat(3,1fr)}.tabs button{font-size:11px}.secret{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><div id="login" class="login"><h1>ВК Реновация</h1><p class="muted">Защищённая панель администратора</p><input id="username" placeholder="Логин" autocomplete="username"><input id="password" type="password" placeholder="Пароль" autocomplete="current-password"><button class="btn" id="loginBtn">Войти</button><p id="loginState" class="error"></p></div><div id="app" class="hidden"><header class="top"><div><h1>Админ-панель</h1><span class="muted">Контент, заявки и AI-провайдеры</span></div><button id="logout">Выйти</button></header><main class="layout"><nav class="tabs"><button class="active" data-tab="ai">AI-ключи</button><button data-tab="leads">Заявки</button><button data-tab="content">Контент</button></nav><section id="view"></section></main></div><div id="toast" class="toast hidden"></div><script>
const $=s=>document.querySelector(s),view=$('#view');let secrets={};
async function api(url,opt={}){const r=await fetch(url,{credentials:'same-origin',...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Ошибка');return j}
function toast(t){$('#toast').textContent=t;$('#toast').classList.remove('hidden');setTimeout(()=>$('#toast').classList.add('hidden'),2500)}
async function check(){try{await api('/api/admin/me');$('#login').classList.add('hidden');$('#app').classList.remove('hidden');show('ai')}catch{}}
$('#loginBtn').onclick=async()=>{try{await api('/api/admin/login',{method:'POST',body:JSON.stringify({username:$('#username').value,password:$('#password').value})});check()}catch(e){$('#loginState').textContent=e.message}};
$('#logout').onclick=async()=>{await api('/api/admin/logout',{method:'POST'});location.reload()};
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('active'));b.classList.add('active');show(b.dataset.tab)});
async function show(tab){if(tab==='ai')return showAI();if(tab==='leads')return showLeads();return showContent()}
async function showAI(){secrets=await api('/api/admin/secrets');let rows=Object.entries(secrets).map(([k,v])=>`<div class="row"><div><b>${k}</b><span class="muted">${v.configured?v.masked:'Не настроен'}</span></div><input data-key="${k}" type="password" placeholder="${v.configured?'Введите новый ключ для замены':''}"></div>`).join('');view.innerHTML=`<div class="panel"><h2>AI-провайдеры и ключи</h2><p class="muted">Ключи шифруются на сервере AES-256-GCM. Полное значение после сохранения не отображается.</p><div>${rows}</div><button class="btn" id="saveSecrets">Сохранить ключи</button> <button class="btn" id="testSecrets">Проверить статус</button><p id="state" class="muted"></p></div>`;$('#saveSecrets').onclick=async()=>{const data={};document.querySelectorAll('[data-key]').forEach(i=>{if(i.value)data[i.dataset.key]=i.value});try{await api('/api/admin/secrets',{method:'POST',body:JSON.stringify(data)});toast('Ключи сохранены');showAI()}catch(e){$('#state').textContent=e.message}};$('#testSecrets').onclick=async()=>{const c=await api('/api/config');$('#state').textContent='Подключены: '+Object.entries(c.providers).filter(([k,v])=>v).map(([k])=>k).join(', ')}};
async function showLeads(){const leads=await api('/api/admin/leads');view.innerHTML=`<div class="panel"><h2>Заявки (${leads.length})</h2>${leads.length?leads.reverse().map(x=>`<article class="lead"><b>${x.name||'Без имени'} · ${x.phone||''}</b><div class="muted">${x.createdAt||''} · ${x.email||''}</div><pre>${JSON.stringify(x.brief||x.message||{},null,2)}</pre></article>`).join(''):'<p class="muted">Заявок пока нет.</p>'}</div>`}
async function showContent(){const c=await api('/api/admin/content');view.innerHTML=`<div class="panel"><h2>Контент сайта</h2><p class="muted">JSON-редактор для текстовых настроек. Сохраняйте только корректный JSON.</p><textarea id="content" class="wide">${JSON.stringify(c,null,2)}</textarea><button class="btn" id="saveContent">Сохранить</button><p id="contentState" class="muted"></p></div>`;$('#saveContent').onclick=async()=>{try{await api('/api/admin/content',{method:'PUT',body:$('#content').value});$('#contentState').textContent='Сохранено';toast('Контент обновлён')}catch(e){$('#contentState').textContent='Ошибка JSON: '+e.message}}}
check();
</script></body></html>
