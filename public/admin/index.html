<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Управление сайтом — ВК Реновация</title><style>:root{--bg:#090a0b;--card:#141517;--gold:#b89a65;--text:#f3efe7;--muted:#aaa59b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui}main{width:min(900px,calc(100% - 28px));margin:5vh auto}.card{background:var(--card);border:1px solid #2a2a2a;padding:clamp(22px,4vw,42px);margin-bottom:16px}h1,h2{font-family:Georgia,serif;font-weight:400}label{display:block;color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.1em;margin:18px 0 7px}input,textarea{width:100%;padding:13px;background:#0e0f10;color:#fff;border:1px solid #393939;outline:0}textarea{min-height:100px;resize:vertical}input:focus,textarea:focus{border-color:var(--gold)}button{padding:11px 18px;border:1px solid var(--gold);background:var(--gold);cursor:pointer;margin:14px 8px 0 0}.secondary{background:none;color:var(--gold)}#editor{display:none}.status{color:var(--gold);min-height:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.service{border-top:1px solid #333;padding-top:10px}.muted{color:var(--muted)}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><main><section class="card" id="login"><h1>Админ-панель</h1><p class="muted">Защищённый вход. Пароль проверяется сервером и не хранится в браузере.</p><label for="password">Пароль</label><input id="password" type="password" autocomplete="current-password"><button id="loginBtn">Войти</button><p class="status" id="loginStatus"></p></section><section id="editor"><div class="card"><h1>Содержание сайта</h1><div class="grid"><div><label for="heroTitle">Первая строка заголовка</label><textarea id="heroTitle"></textarea></div><div><label for="heroAccent">Акцентная строка заголовка</label><textarea id="heroAccent"></textarea></div></div><label for="heroSubtitle">Подзаголовок</label><textarea id="heroSubtitle"></textarea><label for="footerText">Текст в футере</label><input id="footerText"><h2>Услуги</h2><div id="services"></div><button id="saveBtn">Сохранить и опубликовать</button><button class="secondary" id="reloadBtn">Обновить данные</button><button class="secondary" id="logoutBtn">Выйти</button><p class="status" id="status"></p></div><div class="card"><h2>Загрузка изображения</h2><p class="muted">JPEG, PNG или WebP до 5 МБ. После загрузки скопируйте полученный путь в нужный раздел контента.</p><input id="image" type="file" accept="image/jpeg,image/png,image/webp"><label for="imageName">Имя файла</label><input id="imageName"><button id="uploadBtn">Загрузить</button><p class="status" id="uploadStatus"></p></div></section></main><script>
const $=id=>document.getElementById(id);let sha='',data={};const api=(url,opt={})=>fetch(url,{credentials:'same-origin',...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});
function draw(){ $('heroTitle').value=data.site?.heroTitle||'';$('heroAccent').value=data.site?.heroAccent||'';$('heroSubtitle').value=data.site?.heroSubtitle||'';$('footerText').value=data.site?.footerText||'';$('services').innerHTML='';(data.services||[]).forEach((s,i)=>{const d=document.createElement('div');d.className='service grid';d.innerHTML=`<div><label>Название ${i+1}</label><input data-i="${i}" data-k="title"></div><div><label>Описание</label><textarea data-i="${i}" data-k="text"></textarea></div>`;$('services').appendChild(d);d.querySelector('[data-k=title]').value=s.title||'';d.querySelector('[data-k=text]').value=s.text||''});}
async function load(){const r=await api('/api/content');if(r.status===401){$('login').style.display='block';$('editor').style.display='none';return}const x=await r.json();if(!r.ok)throw Error(x.error);data=JSON.parse(x.content);sha=x.sha;draw();$('login').style.display='none';$('editor').style.display='block'}
$('loginBtn').onclick=async()=>{const r=await api('/api/login',{method:'POST',body:JSON.stringify({password:$('password').value})});$('loginStatus').textContent=r.ok?'':(await r.json()).error||'Ошибка входа';if(r.ok)load()};
$('saveBtn').onclick=async()=>{data.site={...data.site,heroTitle:$('heroTitle').value.trim(),heroAccent:$('heroAccent').value.trim(),heroSubtitle:$('heroSubtitle').value.trim(),footerText:$('footerText').value.trim()};document.querySelectorAll('[data-i]').forEach(el=>{data.services[+el.dataset.i][el.dataset.k]=el.value.trim()});const r=await api('/api/content',{method:'PUT',body:JSON.stringify({content:JSON.stringify(data,null,2)+'\n',sha})});$('status').textContent=r.ok?'Сохранено. Vercel обновит сайт после нового деплоя.':(await r.json()).error||'Ошибка';if(r.ok)load()};
$('reloadBtn').onclick=load;$('logoutBtn').onclick=async()=>{await api('/api/logout',{method:'POST'});location.reload()};
$('uploadBtn').onclick=()=>{const file=$('image').files[0];if(!file)return $('uploadStatus').textContent='Выберите файл';if(file.size>5*1024*1024)return $('uploadStatus').textContent='Максимум 5 МБ';const rd=new FileReader();rd.onload=async()=>{const r=await api('/api/upload',{method:'POST',body:JSON.stringify({type:file.type,data:rd.result,name:$('imageName').value||file.name})});const x=await r.json();$('uploadStatus').textContent=r.ok?'Путь: '+x.path:x.error||'Ошибка'};rd.readAsDataURL(file)};load().catch(()=>{});
</script></body></html>
