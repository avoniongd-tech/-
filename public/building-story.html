<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>История строительства | Кейс из портфолио</title>
  <meta name="description" content="Интерактивное повествование о 7 этапах строительства проекта от участка до интерьера.">
  <link rel="stylesheet" href="/assets/css/building-story-v2-ui.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    
    .building-story-header {
      max-width: 1200px;
      margin: 0 auto;
      padding: 3rem 1rem;
      text-align: center;
    }
    
    .building-story-header h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin: 0 0 0.5rem 0;
      color: hsl(0 0% 18%);
    }
    
    @media (prefers-color-scheme: dark) {
      .building-story-header h1 {
        color: hsl(0 0% 95%);
      }
    }
    
    .building-story-header p {
      font-size: 1.125rem;
      color: hsl(0 0% 45%);
      margin: 0;
      max-width: 600px;
      margin: 0 auto;
    }
    
    @media (prefers-color-scheme: dark) {
      .building-story-header p {
        color: hsl(0 0% 55%);
      }
    }
    
    .building-story-footer {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem 1rem;
      text-align: center;
      border-top: 1px solid hsl(0 0% 88%);
      font-size: 0.875rem;
      color: hsl(0 0% 45%);
    }
    
    @media (prefers-color-scheme: dark) {
      .building-story-footer {
        border-top-color: hsl(0 0% 24%);
        color: hsl(0 0% 55%);
      }
    }
  </style>
</head>
<body>
  <div class="building-story-header">
    <h1>История строительства</h1>
    <p>Прокрутите страницу, чтобы увидеть 7 этапов проекта — от земли до готового интерьера.</p>
  </div>

  <div data-building-story></div>

  <div class="building-story-footer">
    <p>Интерактивный проект демонстрирует подход к созданию поэтапных нарративов с использованием CSS 2.5D и scroll-driven анимации.</p>
  </div>

  <script src="/assets/js/building-story-v2.js"></script>
</body>
</html>
